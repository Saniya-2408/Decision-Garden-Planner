<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🧠 Daily Planner</h1>
  <a href="index.html">← Home</a>
</header>

<section class="card">
  <input id="taskInput" placeholder="Task name">
  
  <select id="energy">
    <option>Low Energy</option>
    <option>Medium Energy</option>
    <option>High Energy</option>
  </select>

  <select id="duration">
    <option>15 min</option>
    <option>30 min</option>
    <option>60 min</option>
  </select>

  <button onclick="addTask()">Plant Task 🌱</button>
  <ul id="taskList"></ul>
</section>

<script src="script.js"></script>
</body>
</html>
