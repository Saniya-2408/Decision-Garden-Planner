<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrostFlow Planner</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body class="home">
<div class="app">

<header class="header">
  <h1>❄️ FrostFlow</h1>
  <p>Plan calmly. Execute clearly.</p>
</header>

<section class="add-panel">
  <input id="taskInput" placeholder="Add a task">
  <select id="goalSelect">
    <option value="daily">Daily Goal</option>
    <option value="long">Long-Term Goal</option>
  </select>
  <button id="addTask">Add</button>
</section>

<section class="stats">
  <div class="stat">🎯 Goals <span id="goalCount">0</span></div>
  <div class="stat">🌸 Completed <span id="completedCount">0</span></div>
  <div class="progress">
    <div id="focusBar"></div>
  </div>
</section>

<section id="taskGrid" class="grid"></section>

<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalStage"></p>
    <button id="advanceBtn">Advance</button>
    <button id="deleteBtn" class="danger">Delete</button>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
