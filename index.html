<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Garden</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<div class="app">

<header class="header">
  <h1>🌸 Decision Garden</h1>
  <p>Turn decisions into growth</p>
</header>

<section class="add-section">
  <input id="taskInput" placeholder="Plant a new task...">
  <select id="goalType">
    <option value="daily">🎯 Daily Goal</option>
    <option value="long">🌳 Long-Term Goal</option>
  </select>
  <button id="addTask">Add</button>
</section>

<section class="stats">
  <div class="stat-card">
    <h3>🌸 Completed</h3>
    <p id="completedCount">0</p>
  </div>
  <div class="stat-card">
    <h3>🎯 Goals</h3>
    <p id="goalCount">0</p>
  </div>
  <div class="stat-card">
    <h3>⚡ Focus</h3>
    <div class="progress">
      <div id="focusBar"></div>
    </div>
  </div>
</section>

<section id="taskGrid" class="grid"></section>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <p id="modalGoal"></p>
    <p id="modalStage"></p>
    <button id="advanceBtn">Grow 🌱</button>
    <button id="deleteBtn" class="danger">Delete ❌</button>
    <button onclick="closeModal()" class="ghost">Close</button>
  </div>
</div>

<footer>
  <p>🌱 Decision Garden © 2025</p>
</footer>

</div>
<script src="script.js"></script>
</body>
</html>
