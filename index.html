<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Garden | Home</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="home">
<div class="dashboard-wrapper">

<header class="dash-header">
  <div class="logo">🌸 Decision Garden</div>
  <nav class="dash-nav">
    <ul>
      <li><a class="active" href="index.html">Home</a></li>
      <li><a href="features.html">Features</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="neglected.html">Neglected</a></li>
      <li><a href="growth.html">Growth</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
</header>

<main class="dash-main">

<section class="hero-panel big-hero">
  <h1>Grow Better Decisions</h1>
  <p>Turn tasks into visible progress 🌱</p>
</section>

<section class="add-task-panel">
  <input id="taskInput" placeholder="Plant a new task">
  <select id="goalType">
    <option value="daily">🎯 Daily</option>
    <option value="long">🌳 Long-term</option>
  </select>
  <button id="addTask" class="btn">Add</button>
</section>

<section class="stats-cards grid">
  <div class="card stat-card">
    <h3>Completed</h3>
    <p id="completedCount">0</p>
  </div>
  <div class="card stat-card">
    <h3>Total Goals</h3>
    <p id="goalCount">0</p>
  </div>
  <div class="card stat-card">
    <h3>Focus</h3>
    <div class="progress-bar"><div id="focusBar"></div></div>
  </div>
</section>

<section id="taskGrid" class="task-grid"></section>

</main>

<footer class="dash-footer">Decision Garden © 2025</footer>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <p id="modalGoal"></p>
    <p id="modalStage"></p>
    <button id="advanceBtn" class="btn">Grow</button>
    <button id="deleteBtn" class="btn danger">Delete</button>
    <button onclick="closeModal()" class="btn ghost">Close</button>
  </div>
</div>

<script src="script.js"></script>
</div>
</body>
</html>
